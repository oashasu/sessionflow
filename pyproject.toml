[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionflow"
version = "0.1.0"
description = "Claude Code会话管理工具"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = ["flask>=3.0.0"]

[project.scripts]
sessionflow = "sessionflow:main"

[tool.setuptools.packages.find]
include = ["core", "providers", "providers.*"]
namespaces = false

[tool.setuptools]
py-modules = ["sessionflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]